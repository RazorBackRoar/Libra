name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: macos-26
    steps:
      - name: Checkout L!bra
        uses: actions/checkout@v7

      - name: Build
        run: swift build

      - name: Core unit tests
        run: bash scripts/run-core-unit-tests.sh
