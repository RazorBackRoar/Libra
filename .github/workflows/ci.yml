name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: macos-26
    steps:
      - name: Checkout Libra
        uses: actions/checkout@v7

      # Runner image bumps silently change the toolchain — log it explicitly.
      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Release build check
        run: swift build -c release

      - name: Test
        run: swift test
